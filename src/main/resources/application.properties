spring.application.name=api-orders
spring.config.import=aws-secretsmanager:car-configurator-staging-rds-credentials

spring.datasource.username=${username}
spring.datasource.password=${password}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/ordersdb

# JPA/Hibernate-Einstellungen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true